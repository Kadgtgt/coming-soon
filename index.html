<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="This app is currently under development." />
		<title>Coming Soon</title>

		<style>
			:root {
				--blue: #0756bf;
				--deep-blue: #06255d;
				--light-blue: #6ebcff;
			}

			* {
				box-sizing: border-box;
			}

			body {
				align-items: center;
				background:
					radial-gradient(
						circle at 13% 16%,
						rgba(255, 255, 255, 0.95) 0 5%,
						transparent 5.4%
					),
					radial-gradient(
						circle at 85% 84%,
						rgba(255, 255, 255, 0.87) 0 9%,
						transparent 9.4%
					),
					linear-gradient(135deg, var(--deep-blue), var(--blue) 55%, var(--light-blue));
				display: flex;
				font-family: Arial, Helvetica, sans-serif;
				justify-content: center;
				margin: 0;
				min-height: 100vh;
				padding: 40px 24px;
			}

			body::before,
			body::after {
				background: rgba(255, 255, 255, 0.12);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 50%;
				content: "";
				position: fixed;
				transform: rotate(-20deg);
			}

			body::before {
				height: 48vw;
				right: -19vw;
				top: -22vw;
				width: 48vw;
			}

			body::after {
				bottom: -25vw;
				height: 58vw;
				left: -27vw;
				width: 58vw;
			}

			main {
				max-width: 780px;
				position: relative;
				text-align: center;
				width: 100%;
				z-index: 1;
			}

			.eyebrow {
				color: white;
				font-size: clamp(0.72rem, 1.8vw, 0.9rem);
				font-weight: 700;
				letter-spacing: 0.22em;
				margin: 0 0 24px;
				text-transform: uppercase;
			}

			h1 {
				color: white;
				font-size: clamp(3rem, 10vw, 7rem);
				letter-spacing: -0.055em;
				line-height: 0.88;
				margin: 0;
				text-shadow: 0 8px 30px rgba(1, 26, 76, 0.24);
				text-transform: uppercase;
			}

			.message {
				color: white;
				font-size: clamp(1rem, 2.4vw, 1.32rem);
				line-height: 1.6;
				margin: 32px auto 0;
				max-width: 500px;
			}

			.line {
				background: white;
				border-radius: 100px;
				height: 4px;
				margin: 30px auto;
				opacity: 0.9;
				width: 64px;
			}

			.video-wrap {
				background: rgba(255, 255, 255, 0.12);
				border: 1px solid rgba(255, 255, 255, 0.3);
				border-radius: 18px;
				box-shadow: 0 18px 40px rgba(1, 26, 76, 0.25);
				margin: 0 auto;
				max-width: 650px;
				overflow: hidden;
			}

			video {
				display: block;
				height: auto;
				width: 100%;
			}
		</style>
	</head>

	<body>
		<main>
			<p class="eyebrow">Our app is on its way</p>

			<h1>
				Still under<br />
				development
			</h1>

			<p class="message">
				We are putting the final touches on our app.
				<strong>Coming soon.</strong>
			</p>

			<div class="line"></div>

			<div class="video-wrap">
				<video autoplay muted loop playsinline controls>
					<source src="gasmobil-ad.mp4" type="video/mp4" />
					Your browser does not support video playback.
				</video>
			</div>
		</main>
	</body>
</html>
